    <script>
    class ClothPhysics {
        constructor(object3D, velocity) {
            this.object3D = object3D;
            this.velocity = velocity || { x: 1, y: 1, z: 1 };
            this.basePositions = object3D.geometry.attributes.position.clone();
        }
        update(time, factor, windAngleRad) {
            const positions = this.object3D.geometry.attributes.position;
            const positionsArr = positions.array;
            const baseArr = this.basePositions.array;

            const dirX = Math.sin(windAngleRad);
            const dirZ = -Math.cos(windAngleRad);

            for (let i = 0; i < positions.count; i++) {
                const vx = positionsArr[i * 3];
                const vy = positionsArr[i * 3 + 1];
                const baseVx = baseArr[i * 3];
                const baseVy = baseArr[i * 3 + 1];

                const flex = Math.max(0, (1.25 - baseVy));

                const wave1 = Math.sin(time * 3.5 + vy * 2.2 + vx * 1.5) * 0.03;
                const wave2 = Math.cos(time * 5.0 - vy * 1.5 - vx * 2.0) * 0.015;
                const wave3 = Math.sin(time * 1.8 + vy * 0.8) * 0.01;
                const wave4 = Math.cos(time * 2.2 + baseVy * 1.0) * 0.02;

                const mainForce = (wave1 + wave2 + wave3 + wave4) * flex * factor;
                const forceX = mainForce * dirX;
                const forceZ = mainForce * dirZ;
                const forceY = flex * 0.01;

                positionsArr[i * 3] = baseVx + forceX * this.velocity.x;
                positionsArr[i * 3 + 1] = baseVy + forceY * this.velocity.y;
                positionsArr[i * 3 + 2] = baseArr[i * 3 + 2] + forceZ * this.velocity.z;
            }

            positions.needsUpdate = true;
            this.object3D.geometry.computeVertexNormals();
        }
    }
    </script>

<script>
const TOKYO_LAT = 35.6762;
const TOKYO_LNG = 139.6503;
const TOKYO_TZ = 'Asia/Tokyo';

let isLiveMode = true;
let simulatedDate = new Date();
const treePositions = [];

function degToCompass(num) {
    const val = Math.floor((num / 22.5) + 0.5);
    const arr = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
    return arr[(val % 16)];
}

function createFabricNormalMap(size, intensity) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#8080ff';
    ctx.fillRect(0, 0, size, size);

    for (let y = 0; y < size; y += 3) {
        for (let x = 0; x < size; x += 3) {
            const nx = (Math.random() - 0.5) * intensity * 50;
            const ny = (Math.random() - 0.5) * intensity * 25;
            ctx.fillStyle = `rgb(${Math.floor(128 + nx)},${Math.floor(128 + ny)},255)`;
            ctx.fillRect(x, y, 3, 3);
        }
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

function createGroundTexture(size) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#3a6628';
    ctx.fillRect(0, 0, size, size);

    for (let i = 0; i < 15000; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const g = Math.floor(70 + Math.random() * 80);
        ctx.fillStyle = `rgba(${Math.floor(30 + Math.random() * 30)},${g},${Math.floor(20 + Math.random() * 20)},${0.3 + Math.random() * 0.4})`;
        ctx.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 3);
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(4, 4);
    return tex;
}

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0xbfe3ff, 0.008);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 180);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxDistance = 65;
controls.minDistance = 3;

// Center orbit target right at the middle of the rack
controls.target.set(0, -1.1, 0);

function updateViewportZoom() {
    const isMobile = window.innerWidth <= 768;
    if (isMobile) {
        // Line 431: Mobile camera position  -4.78, -3.88, 12.45
        camera.position.set(-4.78, -3.88, 12.45);
    } else {
        // Line 434: Desktop camera position  x: -4.50, y: -2.84, z: 8.52
        camera.position.set(-4.50, -2.84, 8.52);
    }
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}
updateViewportZoom();

const ambientLight = new THREE.AmbientLight(0xdceeff, 0.5);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfffaed, 1.3);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 120;
sunLight.shadow.camera.left = -35;
sunLight.shadow.camera.right = 35;
sunLight.shadow.camera.top = 35;
sunLight.shadow.camera.bottom = -35;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

const sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 16, 16),

);
scene.add(sunMesh);

const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3a6628, 0.3);

const skyGeo = new THREE.SphereGeometry(120, 32, 32);
const skyMat = new THREE.MeshBasicMaterial({ color: 0x7ac1ff, side: THREE.BackSide });
const skyMesh = new THREE.Mesh(skyGeo, skyMat);
scene.add(skyMesh);

/* 3D Dynamic Clouds System */
const cloudGroup = new THREE.Group();
const cloudMaterials = [];
const cloudsList = [];

function createCloudCluster() {
    const cloud = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.9,
        metalness: 0.0,
        transparent: true,
        opacity: 0.85,
        flatShading: true
    });
    cloudMaterials.push(mat);

    const tuftCount = 5 + Math.floor(Math.random() * 6);
    for (let i = 0; i < tuftCount; i++) {
        const radius = 2.0 + Math.random() * 2.5;
        const geo = new THREE.DodecahedronGeometry(radius, 1);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(
            (Math.random() - 0.5) * 6,
            (Math.random() - 0.5) * 1.8,
            (Math.random() - 0.5) * 5
        );
        mesh.scale.set(1.2, 0.65, 1.0);
        cloud.add(mesh);
    }

    const xPos = (Math.random() - 0.5) * 100;
    const yPos = 14 + Math.random() * 10;
    const zPos = (Math.random() - 0.5) * 80;
    cloud.position.set(xPos, yPos, zPos);

    cloudsList.push({
        group: cloud,
        speed: 0.02 + Math.random() * 0.03
    });
    cloudGroup.add(cloud);
}

for (let i = 0; i < 24; i++) {
    createCloudCluster();
}
scene.add(cloudGroup);

const groundGeo = new THREE.PlaneGeometry(80, 80);
const groundMat = new THREE.MeshStandardMaterial({ map: createGroundTexture(1024), roughness: 0.9 });
const groundMesh = new THREE.Mesh(groundGeo, groundMat);
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.position.y = -4.3;
groundMesh.receiveShadow = true;
scene.add(groundMesh);

const grassGroup = new THREE.Group();
const tuftMat = new THREE.MeshStandardMaterial({ color: 0x3a6b28, roughness: 0.9 });
for (let i = 0; i < 220; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 3.5 + Math.random() * 22;
    const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.2 + Math.random() * 0.2, 4), tuftMat);
    tuft.position.set(Math.cos(angle) * radius, -4.2 + 0.08, Math.sin(angle) * radius);
    tuft.rotation.set((Math.random() - 0.5) * 0.3, Math.random() * Math.PI, (Math.random() - 0.5) * 0.3);
    grassGroup.add(tuft);
}
scene.add(grassGroup);

function createTree(x, z, s) {
    const g = new THREE.Group();
    const trunkHeight = 2.2 * s;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1 * s, 0.14 * s, trunkHeight, 8), new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 0.9 }));
    trunk.position.y = trunkHeight / 2 - 4.3;
    trunk.castShadow = true;
    g.add(trunk);

    const foliageColors = [0x2d6b3a, 0x3a7a48];
    const foliageSpheres = [];

    for (let i = 0; i < 3; i++) {
        const radius = (1.1 - i * 0.22) * s;
        const fY = -4.3 + (2.3 + i * 0.65) * s;
        const f = new THREE.Mesh(new THREE.SphereGeometry(radius, 8, 6), new THREE.MeshStandardMaterial({ color: foliageColors[i % 2], roughness: 0.85 }));
        f.position.y = fY; f.scale.y = 0.75;
        f.castShadow = true; f.receiveShadow = true;
        g.add(f);

        foliageSpheres.push({ fY: fY, radius: radius });
    }
    g.position.set(x, 0, z);

    treePositions.push({ x: x, z: z, foliage: foliageSpheres });
    return g;
}

[[-22,-18], [-16,14], [20,-12], [18,16], [-28,4], [25,-20], [-12,-22], [22,22], [-30,-8], [28,2]].forEach(([x,z]) => {
    scene.add(createTree(x, z, 2.2 + Math.random() * 1.0));
});

function buildClothesRack() {
    const rackGroup = new THREE.Group();
    const pipeMat = new THREE.MeshStandardMaterial({ color: 0xd0d5db, metalness: 0.85, roughness: 0.25 });
    const jointMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.6, metalness: 0.1 });

    const topBarY = 2.05, floorY = -4.3, rackWidth = 5.6, poleHeight = topBarY - floorY;

    const topBar = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, rackWidth, 24).rotateZ(Math.PI / 2), pipeMat);
    topBar.position.set(0, topBarY, 0); topBar.castShadow = true; topBar.receiveShadow = true;
    rackGroup.add(topBar);

    [-rackWidth / 2 + 0.15, rackWidth / 2 - 0.15].forEach(xPos => {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, poleHeight, 16), pipeMat);
        pole.position.set(xPos, floorY + poleHeight / 2, 0); pole.castShadow = true; pole.receiveShadow = true;
        rackGroup.add(pole);

        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.065, 16, 16), jointMat);
        cap.position.set(xPos, topBarY, 0);
        rackGroup.add(cap);

        const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.2, 16).rotateX(Math.PI / 2), pipeMat);
        foot.position.set(xPos, floorY + 0.05, 0); foot.castShadow = true; foot.receiveShadow = true;
        rackGroup.add(foot);
    });

    return rackGroup;
}
scene.add(buildClothesRack());

const hangerGroup = new THREE.Group();
hangerGroup.position.set(0, 2.05, 0);
hangerGroup.rotation.y = -Math.PI / 4;
scene.add(hangerGroup);

const itemContainer = new THREE.Group();
itemContainer.position.set(0, -2.05, 0);
hangerGroup.add(itemContainer);

function buildHanger() {
    const woodenMat = new THREE.MeshStandardMaterial({ color: 0xcd853f, roughness: 0.4, metalness: 0.1 });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.9, roughness: 0.2 });

    const hangerShape = new THREE.Shape();
    hangerShape.moveTo(-1.4, 0.70);
    hangerShape.quadraticCurveTo(0, 1.35, 1.4, 0.70);
    hangerShape.lineTo(1.32, 0.53);
    hangerShape.quadraticCurveTo(0, 1.15, -1.32, 0.53);
    hangerShape.closePath();

    const hangerGeo = new THREE.ExtrudeGeometry(hangerShape, { depth: 0.12, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.02, bevelSegments: 3 });
    hangerGeo.translate(0, 0, -0.06);

    const bodyMesh = new THREE.Mesh(hangerGeo, woodenMat); bodyMesh.castShadow = true;

    const hookCurve = new THREE.CurvePath();
    hookCurve.add(new THREE.LineCurve3(new THREE.Vector3(0, 1.05, 0), new THREE.Vector3(0, 1.45, 0)));
    hookCurve.add(new THREE.CubicBezierCurve3(new THREE.Vector3(0, 1.45, 0), new THREE.Vector3(0.45, 1.55, 0), new THREE.Vector3(0.35, 2.12, 0), new THREE.Vector3(0, 2.10, 0)));
    hookCurve.add(new THREE.CubicBezierCurve3(new THREE.Vector3(0, 2.10, 0), new THREE.Vector3(-0.35, 2.05, 0), new THREE.Vector3(-0.32, 1.75, 0), new THREE.Vector3(-0.22, 1.70, 0)));

    const hookMesh = new THREE.Mesh(new THREE.TubeGeometry(hookCurve, 40, 0.025, 8, false), metalMat);
    hookMesh.castShadow = true;

    const hanger = new THREE.Group();
    hanger.add(bodyMesh); hanger.add(hookMesh);
    hanger.position.y = 0.1;
    return hanger;
}

function createTShirtGeometry() {
    const bodyShape = new THREE.Shape();

    bodyShape.lineTo(1.85, 0.65);
    bodyShape.lineTo(1.5, -0.15);
    bodyShape.lineTo(0.95, 0.25);
    bodyShape.lineTo(0.9, -1.3);
    bodyShape.quadraticCurveTo(0, -1.35, -0.9, -1.3);
    bodyShape.lineTo(-0.95, 0.25);
    bodyShape.lineTo(-1.5, -0.15);
    bodyShape.lineTo(-1.85, 0.65);

    bodyShape.quadraticCurveTo(0, 0.55, 0.65, 1.25);

}

let currentWeatherData = { temp: null, condition: 'Loading...', windSpeed: 0.5, windDirectionDeg: 0, rawWindSpeedMS: 0, weatherCode: 0 };
let isUserWeatherOverride = false;

function mapWeatherCodeToSelectOption(code) {
    if (code === 0 || code === 1) return 'clear';
    if (code === 2 || code === 3) return 'cloudy';
    if (code >= 45 && code <= 48) return 'fog';
    if ((code >= 51 && code <= 65) || (code >= 80 && code <= 82)) return 'rain';
    if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return 'snow';
    if (code >= 95) return 'thunder';
    return 'clear';
}

async function fetchWeather() {
    try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${TOKYO_LAT}&longitude=${TOKYO_LNG}&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m`);
        const data = await response.json();
        const current = data.current;

        currentWeatherData.temp = current.temperature_2m;
        currentWeatherData.rawWindSpeedMS = current.wind_speed_10m;
        const mappedWind = Math.min(3, Math.max(0.5, current.wind_speed_10m * 0.2));
        currentWeatherData.windSpeed = mappedWind;
        currentWeatherData.windDirectionDeg = current.wind_direction_10m || 0;
        currentWeatherData.weatherCode = current.weather_code;

        const windSlider = document.getElementById('wind-speed');
        const windDirSlider = document.getElementById('wind-dir');

        if (isLiveMode) {
            if (windSlider) {
                windSlider.value = mappedWind;
                windFactor = mappedWind;
            }
            if (windDirSlider) {
                windDirSlider.value = currentWeatherData.windDirectionDeg;
                windDirectionDeg = currentWeatherData.windDirectionDeg;
            }
        }

        const weatherMap = {
            0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
            45: 'Foggy', 48: 'Depositing rime fog', 51: 'Light drizzle', 53: 'Moderate drizzle',
            55: 'Dense drizzle', 61: 'Slight rain', 63: 'Moderate rain', 65: 'Heavy rain',
            71: 'Slight snow', 73: 'Moderate snow', 75: 'Heavy snow', 95: 'Thunderstorm'
        };
        currentWeatherData.condition = weatherMap[current.weather_code] || 'Unknown';

        document.getElementById('tempVal').textContent = `${currentWeatherData.temp}°C`;
        document.getElementById('condVal').textContent = isUserWeatherOverride ? mapOverrideText(weatherOverride) : currentWeatherData.condition;
        document.getElementById('windDirVal').textContent = `${Math.round(windDirectionDeg)}° ${degToCompass(windDirectionDeg)}`;
        document.getElementById('windSpeedVal').textContent = `${currentWeatherData.rawWindSpeedMS.toFixed(1)} m/s`;

        const liveCategory = mapWeatherCodeToSelectOption(current.weather_code);
        if (!isUserWeatherOverride) {
            weatherOverride = liveCategory;
            document.getElementById('weatherTestSelect').value = liveCategory;
        }
    } catch (e) {
        document.getElementById('condVal').textContent = 'Error';
    }
}

function mapOverrideText(val) {
    const map = { clear: 'Clear (override)', cloudy: 'Cloudy (override)', rain: 'Rain (override)', snow: 'Snow (override)', fog: 'Fog (override)', thunder: 'Thunderstorm (override)' };
    return map[val] || currentWeatherData.condition;
}

function getTokyoDate() {
    if (!isLiveMode) return simulatedDate;
    const now = new Date();
    return new Date(now.toLocaleString("en-US", { timeZone: TOKYO_TZ }));
}

function updateSolarPosition() {
    const date = getTokyoDate();
    const sunPos = SunCalc.getPosition(date, TOKYO_LAT, TOKYO_LNG);
    const sunTimes = SunCalc.getTimes(date, TOKYO_LAT, TOKYO_LNG);

    const alt = sunPos.altitude;
    const az = sunPos.azimuth;

    const dist = 60;
    const x = dist * Math.cos(alt) * Math.sin(az);
    const y = dist * Math.sin(alt);
    const z = dist * Math.cos(alt) * Math.cos(az);

    sunLight.position.set(x, Math.max(-10, y), z);
    sunMesh.position.set(x, y, z);

    let skyColor = new THREE.Color();
    let sunColor = new THREE.Color();
    let lightInt = 1.0;
    let phase = '';

    const currentHrs = date.getHours() + date.getMinutes() / 60;

    if (alt <= -0.08) {
        phase = 'Night';
        skyColor.setHex(0x0a1128);
        sunColor.setHex(0x60a5fa);
        lightInt = 0.2;
        sunLight.castShadow = false;
    } else if (alt > -0.08 && alt <= 0.15) {
        phase = currentHrs < 12 ? 'Morning (Dawn)' : 'Afternoon (Sunset)';
        skyColor.setHex(0xf97316);
        sunColor.setHex(0xff7800);
        lightInt = 0.85;
        sunLight.castShadow = true;
    } else {
        phase = currentHrs < 12 ? 'Morning' : 'Afternoon';
        skyColor.setHex(0x60a5fa);
        sunColor.setHex(0xfffbeb);
        lightInt = Math.min(1.6, Math.max(0.8, Math.sin(alt) * 1.8));
        sunLight.castShadow = true;
    }

    let activeWeatherPattern = isUserWeatherOverride ? weatherOverride : mapWeatherCodeToSelectOption(currentWeatherData.weatherCode);

    const isThunder = (activeWeatherPattern === 'thunder');
    const isRain = (activeWeatherPattern === 'rain');
    const isFog = (activeWeatherPattern === 'fog');
    const isSnow = (activeWeatherPattern === 'snow');
    const isCloudy = (activeWeatherPattern === 'cloudy');

    let cloudColor = new THREE.Color(0xffffff);
    let cloudOpacity = 0.85;

    if (alt <= -0.08) {
        cloudColor.setHex(0x1e293b);
    } else if (alt > -0.08 && alt <= 0.15) {
        cloudColor.setHex(0xfdcba0);
    }

    if (isCloudy) {
        skyColor.lerp(new THREE.Color(0x94a3b8), 0.55);
        cloudColor.lerp(new THREE.Color(0xb0bec5), 0.5);
        lightInt *= 0.75;
        cloudGroup.visible = true;
        cloudOpacity = 0.9;
    } else if (isFog) {
        skyColor.lerp(new THREE.Color(0xcccccc), 0.6);
        lightInt *= 0.6;
        scene.fog.density = 0.02;
        cloudGroup.visible = true;
        cloudOpacity = 0.4;
    } else if (isRain) {
        skyColor.lerp(new THREE.Color(0x778899), 0.7);
        cloudColor.lerp(new THREE.Color(0x546e7a), 0.7);
        lightInt *= 0.5;
        scene.fog.density = 0.015;
        cloudGroup.visible = true;
        cloudOpacity = 0.95;
    } else if (isThunder) {
        skyColor.lerp(new THREE.Color(0x2d3748), 0.85);
        cloudColor.lerp(new THREE.Color(0x263238), 0.85);
        lightInt *= 0.35;
        scene.fog.density = 0.025;
        cloudGroup.visible = true;
        cloudOpacity = 0.98;
        if (Math.random() < 0.04) {
            lightInt = 2.5;
            skyColor.setHex(0x99bbff);
            cloudColor.setHex(0xd1e8ff);
        }
    } else if (isSnow) {
        skyColor.lerp(new THREE.Color(0xdddddd), 0.5);
        cloudColor.lerp(new THREE.Color(0xcfe2ec), 0.4);
        lightInt *= 0.75;
        scene.fog.density = 0.01;
        cloudGroup.visible = true;
        cloudOpacity = 0.9;
    } else {
        scene.fog.density = 0.008;
        cloudGroup.visible = false;
    }

    cloudMaterials.forEach(m => {
        m.color.copy(cloudColor);
        m.opacity = cloudOpacity;
    });

    let rainDropCount = 0;
    if (isThunder) {
        rainDropCount = 900;
    } else if (isRain) {
        if (!isUserWeatherOverride) {
            const code = currentWeatherData.weatherCode;
            if (code === 51) rainDropCount = 175;
            else if (code === 53) rainDropCount = 250;
            else if (code === 55) rainDropCount = 325;
            else if (code === 61) rainDropCount = 400;
            else if (code === 63) rainDropCount = 550;
            else if (code === 65) rainDropCount = 800;
            else rainDropCount = 450;
        } else {
            rainDropCount = 450;
        }
    }

    if (rainDropCount > 0) {
        rainParticles.visible = true;
        snowParticles.visible = false;
        rGeo.setDrawRange(0, rainDropCount);
    } else if (isSnow) {
        rainParticles.visible = false;
        snowParticles.visible = true;
    } else {
        rainParticles.visible = false;
        snowParticles.visible = false;
    }

    skyMat.color.copy(skyColor);
    scene.fog.color.copy(skyColor);
    sunLight.color.copy(sunColor);
    sunLight.intensity = lightInt;
    ambientLight.intensity = alt > 0 ? 0.4 : 0.15;

    document.getElementById('clockDisplay').textContent = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')} JST`;
    document.getElementById('dateDisplay').textContent = date.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });

    const pill = document.getElementById('phasePill');
    pill.textContent = phase;
    pill.className = 'phase-pill ' + (phase.includes('Morning') ? 'phase-morning' : phase.includes('Afternoon') ? 'phase-afternoon' : 'phase-night');

    document.getElementById('altVal').textContent = `${(alt * 180 / Math.PI).toFixed(1)}°`;
    document.getElementById('azVal').textContent = `${((az * 180 / Math.PI + 180) % 360).toFixed(1)}°`;

    const fmt = (d) => d ? `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '--:--';
    document.getElementById('sunriseVal').textContent = fmt(sunTimes.sunrise);
    document.getElementById('sunsetVal').textContent = fmt(sunTimes.sunset);
}

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    // Live logging of current camera position to browser console for custom view setup
    //console.log(`Camera Position -> x: ${camera.position.x.toFixed(2)}, y: ${camera.position.y.toFixed(2)}, z: ${camera.position.z.toFixed(2)}`);

    const t = clock.getElapsedTime() * windFactor * 2.5;

    const windAngleRad = (windDirectionDeg + 180) * (Math.PI / 180);
    const windDirX = Math.sin(windAngleRad);
    const windDirZ = -Math.cos(windAngleRad);

    updateSolarPosition();

    if (cloudGroup.visible) {
        for (let i = 0; i < cloudsList.length; i++) {
            const c = cloudsList[i];
            c.group.position.x += windDirX * c.speed * windFactor * 1.5;
            c.group.position.z += windDirZ * c.speed * windFactor * 1.5;

            if (c.group.position.x > 60) c.group.position.x = -60;
            if (c.group.position.x < -60) c.group.position.x = 60;
            if (c.group.position.z > 60) c.group.position.z = -60;
            if (c.group.position.z < -60) c.group.position.z = 60;
        }
    }

    const swingMag = 0.09 * windFactor;
    hangerGroup.rotation.z = Math.sin(t * 0.8) * swingMag * windDirX;
    hangerGroup.rotation.x = Math.cos(t * 0.6) * swingMag * windDirZ;

    clothPhysics.update(t, windFactor, windAngleRad);

    const logoFlex = Math.max(0, (1.25 - 0.28));
    const clothDisplacement = (Math.sin(t * 3.5 + 0.28 * 2.2) * 0.03 + Math.cos(t * 5.0 - 0.28 * 1.5) * 0.015 + Math.sin(t * 1.8 + 0.28 * 0.8) * 0.01) * logoFlex * windFactor;
    mLogo.position.z = 0.125 + clothDisplacement * windDirZ;
    mLogo.position.x = clothDisplacement * windDirX;

    grassGroup.children.forEach((g, i) => {
        const sway = Math.sin(t * 0.8 + i * 0.4) * 0.12 * windFactor;
        g.rotation.z = sway * windDirX;
        g.rotation.x = sway * windDirZ;
    });

    const pp = pGeo.attributes.position.array;
    for (let i = 0; i < pCount; i++) {
        pp[i * 3] += windDirX * pVel[i].speed * windFactor;
        pp[i * 3 + 2] += windDirZ * pVel[i].speed * windFactor;
        pp[i * 3 + 1] += Math.sin(t + i) * 0.003;
        if (Math.abs(pp[i * 3]) > 10 || Math.abs(pp[i * 3 + 2]) > 10) {
            pp[i * 3] = (Math.random() - 0.5) * 14;
            pp[i * 3 + 2] = (Math.random() - 0.5) * 10;
            pp[i * 3 + 1] = Math.random() * 5 - 2;
        }
    }
    pGeo.attributes.position.needsUpdate = true;

    if (rainParticles.visible) {
        const rp = rGeo.attributes.position.array;
        const currentActiveCount = rGeo.drawRange.count;
        for (let i = 0; i < currentActiveCount; i++) {
            rp[i * 3] += windDirX * windFactor * 0.08;
            rp[i * 3 + 2] += windDirZ * windFactor * 0.08;
            rp[i * 3 + 1] -= rVel[i] * 0.22;
            if (rp[i * 3 + 1] < -5) {
                rp[i * 3 + 1] = Math.random() * 14 + 6;
                rp[i * 3] = (Math.random() - 0.5) * 70;
                rp[i * 3 + 2] = (Math.random() - 0.5) * 60;
            }
        }
        rGeo.attributes.position.needsUpdate = true;
    }

    if (snowParticles.visible) {
        const sp = sGeo.attributes.position.array;
        for (let i = 0; i < sCount; i++) {
            if (sAccumulated[i]) {
                sAccumTimer[i] += 1;
                if (sAccumTimer[i] > 200 + Math.random() * 300) {
                    sAccumulated[i] = false;
                    sAccumTimer[i] = 0;
                    sp[i * 3 + 1] = Math.random() * 6 + 10;
                    sp[i * 3] = (Math.random() - 0.5) * 70;
                    sp[i * 3 + 2] = (Math.random() - 0.5) * 60;
                }
            } else {
                const windSway = Math.sin(t * 1.2 + i * 0.5) * 0.04;

                sp[i * 3] += (windDirX * 0.08 + windSway * windDirX) * windFactor;
                sp[i * 3 + 2] += (windDirZ * 0.08 + windSway * windDirZ) * windFactor;
                sp[i * 3 + 1] -= sVel[i] * 0.08 * (0.7 + windFactor * 0.6);

                let groundLimit = -4.3;

                for (let j = 0; j < treePositions.length; j++) {
                    const tree = treePositions[j];
                    const dx = sp[i * 3] - tree.x;
                    const dz = sp[i * 3 + 2] - tree.z;
                    const distSq = dx * dx + dz * dz;

                    for (let k = 0; k < tree.foliage.length; k++) {
                        const f = tree.foliage[k];
                        if (distSq < f.radius * f.radius) {
                            const surfaceY = f.fY + 0.75 * Math.sqrt(Math.max(0, f.radius * f.radius - distSq));
                            if (sp[i * 3 + 1] <= surfaceY) {
                                groundLimit = Math.max(groundLimit, surfaceY);
                            }
                        }
                    }
                }

                const rackBarXHalf = 2.8;
                const rackBarR = 0.045;
                const rackBarY = 2.05;
                if (Math.abs(sp[i * 3]) <= rackBarXHalf) {
                    const dz = sp[i * 3 + 2];
                    if (Math.abs(dz) <= rackBarR) {
                        const surfaceY = rackBarY + Math.sqrt(Math.max(0, rackBarR * rackBarR - dz * dz));
                        if (sp[i * 3 + 1] <= surfaceY) {
                            groundLimit = Math.max(groundLimit, surfaceY);
                        }
                    }
                }

                const capR = 0.065;
                const capXs = [-2.65, 2.65];
                for (let c = 0; c < capXs.length; c++) {
                    const dx = sp[i * 3] - capXs[c];
                    const dz = sp[i * 3 + 2];
                    const distSq = dx * dx + dz * dz;
                    if (distSq < capR * capR) {
                        const surfaceY = rackBarY + Math.sqrt(Math.max(0, rackBarR * rackBarR - distSq));
                        if (sp[i * 3 + 1] <= surfaceY) {
                            groundLimit = Math.max(groundLimit, surfaceY);
                        }
                    }
                }

                const footR = 0.05;
                const footY = -4.25;
                const footZHalf = 1.1;
                if (Math.abs(sp[i * 3 + 2]) <= footZHalf) {
                    for (let f = 0; f < capXs.length; f++) {
                        const dx = sp[i * 3] - capXs[f];
                        if (Math.abs(dx) <= footR) {
                            const surfaceY = footY + Math.sqrt(Math.max(0, footR * footR - dx * dx));
                            if (sp[i * 3 + 1] <= surfaceY) {
                                groundLimit = Math.max(groundLimit, surfaceY);
                            }
                        }
                    }
                }

                if (sp[i * 3 + 1] <= groundLimit) {
                    sp[i * 3 + 1] = groundLimit;
                    sAccumulated[i] = true;
                    sAccumTimer[i] = 0;
                }
            }
        }
        sGeo.attributes.position.needsUpdate = true;
    }

    controls.update();
    renderer.render(scene, camera);
}

window.addEventListener('resize', updateViewportZoom);

animate();
</script>
